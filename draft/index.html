<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>30 Days to the Stage | Playable Draft</title>
<style>*{box-sizing:border-box}body{margin:2rem auto;padding:0 1rem;max-width:620px;background:#faf9f5;color:#222;font:17px/1.55 system-ui}h1{font: bold 2.4rem Georgia}button{font:inherit;padding:.45rem .7rem;margin:.15rem;border:1px solid #888;border-radius:4px;background:white;cursor:pointer}button[aria-pressed=true]{background:#283c38;color:white}#mirror{background:#e4e9e3;text-align:center}svg{height:230px;max-width:100%}small{letter-spacing:.1em}button:disabled{opacity:.5}</style>
<main><small>WCWP 100 · PLAYABLE DRAFT</small><h1>30 Days to the Stage</h1><p id="story">You wake up with sand in your shoes. Two moons hang over an arena. A ticket in your pocket says “Return to Earth.”</p><button id="next">Turn over the ticket</button>
<section id="room" hidden><h2 id="day"></h2><div id="mirror"></div><p id="log" role="status"></p><div id="controls"><p>Choose one muscle group for your next five days of training.</p><div id="options"></div><button id="rest" disabled>Train and sleep for five days</button></div><button id="again" hidden>Play again</button></section></main>
<script src="../art.js"></script><script>
const get=id=>document.getElementById(id),groups=['Arms','Chest','Legs'],counts=[0,0,0];let nights=0,selection=-1,turned=false;
function draw(){get('mirror').innerHTML=CupArt.athlete(counts);get('log').textContent=groups.map((name,i)=>name+' '+counts[i]).join(' · ');get('day').textContent=nights===30?'Competition night':'Training day '+(nights+1)+' of 30'}
get('next').onclick=()=>{if(!turned){turned=true;get('story').textContent='The gate opens in thirty days. Win the bodybuilding contest and it will take you home. The head judge loves a silhouette that stands out from the back row.';get('next').textContent='Enter the gym';return}get('next').hidden=true;get('story').hidden=true;get('room').hidden=false;draw()};
groups.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{selection=i;[...get('options').children].forEach((x,j)=>x.setAttribute('aria-pressed',String(i===j)));get('rest').disabled=false};get('options').append(b)});
get('rest').onclick=()=>{if(selection<0||nights>=30)return;counts[selection]+=5;nights+=5;draw();if(nights===30){get('controls').hidden=true;const win=Math.max(...counts)>=20;get('log').append(document.createElement('br'),win?'Your signature muscle catches the judge’s eye. You win the Cup and step through the gate to Earth.':'A local athlete takes the Cup. The gate closes. Would you train differently just to please this judge?');get('again').hidden=false}};
get('again').onclick=()=>location.reload();
</script></html>
